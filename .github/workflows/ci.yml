name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Go caches are keyed per job and platform, and by commit so every run saves
# its incremental build; restore-keys pick up the most recent one. setup-go's
# own cache is off because it keys only on OS and go.sum, so all Linux jobs
# fought over a single entry and most of them missed.

jobs:
  semver-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject breaking-change markers (pinned to 1.x)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: .github/scripts/no-breaking.sh "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Locate Go caches
        id: go-env
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.build }}
            ${{ steps.go-env.outputs.mod }}
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-

      # Cache the downloaded packages rather than apt's lists, then install
      # from them without `apt-get update`. A stale cache falls back to a
      # normal update and install.
      - name: Cache ffmpeg packages
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-ffmpeg-${{ env.ImageOS }}-${{ env.ImageVersion }}
          restore-keys: apt-ffmpeg-${{ env.ImageOS }}-
      - name: Install ffmpeg for decoder integration tests
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/apt-archives/partial
          install() { sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-archives" ffmpeg; }
          install || { sudo apt-get update && install; }
          sudo chown -R "$USER" ~/apt-archives

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: govulncheck
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  build:
    needs: test
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Locate Go caches
        id: go-env
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.build }}
            ${{ steps.go-env.outputs.mod }}
          key: go-build-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}-
            go-build-${{ matrix.goos }}-${{ matrix.goarch }}-
      - name: Build
        id: build
        run: echo "archive=$(.github/scripts/build.sh ${{ matrix.goos }} ${{ matrix.goarch }} "$(git describe --tags --always)")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: encomplayer-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.build.outputs.archive }}
          if-no-files-found: error
